AWSTemplateFormatVersion: "2010-09-09"
Description: "Cloudformation training"

Parameters:
  KeyName: 
    Type: AWS::EC2::KeyPair::KeyName
    Default: kp-ec2-apne1-jin-202603
    Description: 既存キーペア名(東京)

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-06cce67a5893f85f9
    Description: 固定AMI ID(Amazon Linux 2023 / ap-northeast-1)

  MySshCidr:
    Type: String
    Description: SSHを許可する送信元CIDR(例 あなたのIP/32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: 例 203.0.113.45/32 の形式で入力してください

  AlarmEmail:
    Type: String
    Description: 通知先メールアドレス

# ---------- VPC ----------
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16 #IPv4 CIDR ブロック
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: aws-study-vpc #名前タグ

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: aws-study-cfn-vpc-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ---------- Subnets ----------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: ap-northeast-1a    
      CidrBlock: 10.0.0.0/20
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: 1a-public-subnet

  # ---------- Public Route tables ----------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: aws-study-vpc-rtb-public
  
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      GatewayId: !Ref InternetGateway
      DestinationCidrBlock: 0.0.0.0/0
  
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  # ---------- EC2 Instance -----------
  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: aws-study-ec2-sg
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MySshCidr

  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref Ec2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: aws-study-ec2

# ---------- CloudWatch Alarm (CPU) -----------
  CpuAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Name
          Value: aws-study-cpu-alarm-topic

  CpuAlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CpuAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "EC2 CPUUtilization is too high"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId 
          Value: !Ref WebInstance
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 1
      Threshold: 60
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CpuAlarmTopic
      OKActions:
        - !Ref CpuAlarmTopic

# ---------- Output コンソール→スタック→出力タブ -----------
Outputs:
  Ec2PublicIp:
    Description: EC2 public IPv4
    Value: !GetAtt WebInstance.PublicIp

  CpuAlarmTopicArn:
    Description: SNS topic ARN for CPU alarms
    Value: !Ref CpuAlarmTopic